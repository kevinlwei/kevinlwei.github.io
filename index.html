<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Defense-in-depth copy of the CSP; the authoritative header (which adds
       frame-ancestors) is set by a Cloudflare response-header transform rule.
       Keep the two in sync. frame-ancestors is omitted here because it is
       ignored in <meta> CSPs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; base-uri 'none'; object-src 'none'; form-action 'self'; upgrade-insecure-requests">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WJXZQ7543"></script>
  <script src="/js/gtag-init.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>K. Wei</title>
  <meta name="description" content="I am an AI researcher focused on the science of evals and legal AI safety/alignment. I also work on questions in technical AI governance.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kevinlwei.com/">
  <meta property="og:title" content="K. Wei">
  <meta property="og:description" content="I am an AI researcher focused on the science of evals and legal AI safety/alignment. I also work on questions in technical AI governance.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@kevinlwei">
  <meta name="twitter:title" content="K. Wei">
  <meta name="twitter:description" content="I am an AI researcher focused on the science of evals and legal AI safety/alignment. I also work on questions in technical AI governance.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="/css/normalize.css" />
  <link rel="stylesheet" type="text/css" href="/css/index.css" />

  <script type="text/javascript" src="/js/jquery.min.js"></script>
  <script type="text/javascript" src="/js/jqconsole.min.js"></script>
  <script type="text/javascript" src="/js/fuse.min.js"></script>

  <script type="text/javascript" src="/js/helpers.js"></script>
  <script type="text/javascript" src="/js/prompts.js"></script>
  <script type="text/javascript" src="/js/index.js"></script>
</head>
<body>
  <div id="console" role="application" aria-label="Interactive terminal for Kevin Wei's personal site. Type 'help' to see available commands."></div>
</body>
</html>
